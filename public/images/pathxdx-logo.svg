<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 40" fill="none" role="img" aria-label="PathXdx">
  <defs>
    <linearGradient id="px-mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(173 72% 42%)"/>
      <stop offset="100%" stop-color="hsl(286 100% 68%)"/>
    </linearGradient>
  </defs>
  <!-- Mark: gradient tile + monogram -->
  <rect width="36" height="36" x="0" y="2" rx="9" fill="url(#px-mark)"/>
  <text
    x="18"
    y="26.5"
    text-anchor="middle"
    fill="hsl(232 38% 6%)"
    font-family="system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="12.5"
    font-weight="700"
    letter-spacing="-0.04em"
  >
    PX
  </text>
  <!-- Wordmark -->
  <text x="44" y="27" fill="hsl(210 40% 98%)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" letter-spacing="-0.03em">Path</text>
  <text x="91" y="27" fill="hsl(286 100% 68%)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.03em">X</text>
  <text x="104" y="27" fill="hsl(210 40% 98%)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" letter-spacing="-0.03em">dx</text>
</svg>
